<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Locations</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="application">
<aside id="picture-list">
    <h2>Pictures</h2>
    <div id="list-controls">
        <button id="google-maps-button" onclick="openSelectedLocationInGoogleMaps()">
            Open location in Google Maps
        </button>
        <br>
        <button onclick="zoomToSelectedPicture()">Zoom to selected</button>
        <button onclick="zoomToAllPictures()">Zoom to all</button>
        <div id="list-status"></div>
    </div>
    <div id="pictures"></div>
    <div id="list-sentinel"></div>
</aside>
<section id="map"></section>
<div id="splitter"></div>
<section id="picture-viewer">
    <h2 id="viewer-title">Select a picture</h2>
    <div id="viewer-navigation">
        <button class="viewer-navigation" aria-label="Previous picture"
                onclick="showPreviousPicture()">&lt;</button>
        <button class="viewer-navigation" aria-label="Next picture"
                onclick="showNextPicture()">&gt;</button>
    </div>
    <div id="viewer-image-container">
        <img id="viewer-image" alt="">
    </div>
    <div id="viewer-controls">
        <button onclick="zoomImageOut()">−</button>
        <span id="zoom-level">100%</span>
        <button onclick="zoomImageIn()">+</button>
        <button onclick="resetImageZoom()">Reset</button>
        <button id="slideshow-button" onclick="startSlideshow()">Start slideshow</button>
        <button id="slideshow-stop-button" onclick="stopSlideshow()" disabled>Stop slideshow</button>
        <label for="slideshow-interval">Seconds:</label>
        <input id="slideshow-interval" type="number" min="1" step="1" value="5"
               aria-label="Seconds between slides">
    </div>
</section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Generated by visho: defines the global "locations" array -->
<script src="locations.js"></script>
<script src="app.js"></script>
</body>
</html>
